name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Build, unit tests, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/deploy-html.test.mjs
      - run: node --test scripts/browser-helpers.test.mjs
      # Unit tests, failing if coverage of the logic modules drops below the
      # thresholds in vitest.config.ts.
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:updates
      - run: npm run shot
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: production-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Tauri crate embeds dist/ at compile time.
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run test:rust

  deploy:
    name: Deploy production
    needs: [web, desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never interrupt an upload. Recheck main inside this lock because older
    # workflows can finish their tests after a newer release has deployed.
    concurrency:
      group: netlify-production
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - name: Skip superseded commits
        id: release
        shell: bash
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$latest"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $GITHUB_SHA; main is now $latest." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.release.outputs.current == 'true'
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.current == 'true'
        with:
          name: production-build
          path: dist/
      - name: Publish tested build
        if: steps.release.outputs.current == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"
          npx --yes netlify-cli@26.0.1 deploy --prod --dir dist --no-build --site "$NETLIFY_SITE_ID" --message "$GITHUB_SHA"
      - name: Verify published files
        if: steps.release.outputs.current == 'true'
        run: node scripts/verify-deploy.mjs
