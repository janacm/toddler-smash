name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Build, unit tests, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/deploy-html.test.mjs
      # Unit tests, failing if coverage of the logic modules drops below the
      # thresholds in vitest.config.ts.
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:updates
      - run: npm run shot
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: production-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Tauri crate embeds dist/ at compile time.
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run test:rust

      # macOS signing keychain setup
      - name: Import Apple Certificate (macOS)
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KC_PASS="${KEYCHAIN_PASSWORD:-temporary-ci-keychain-pass}"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      # macOS build: signed + notarized
      - name: Build and Notarize macOS Desktop Bundle
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          CI: true
        run: npm run desktop:build

      # macOS build: unsigned (for PRs / environments without signing secrets)
      - name: Build Unsigned macOS Desktop Bundle
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE == ''
        env:
          CI: true
        run: npm run desktop:build -- --no-sign

      # macOS keychain cleanup
      - name: Clean up Keychain (macOS)
        if: always() && matrix.os == 'macos-latest'
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      # Windows signing cert import (PFX)
      - name: Import Windows Code Signing Certificate
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = "$env:TEMP\signing_cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          Remove-Item $certPath -Force

      # Windows build: signed via certificate store
      - name: Build Signed Windows Desktop Bundle
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          CI: true
        run: npm run desktop:build

      # Windows build: unsigned (or preparation for Microsoft Trusted Signing)
      - name: Build Windows Desktop Bundle
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE == ''
        shell: pwsh
        env:
          CI: true
        run: npm run desktop:build -- --no-sign

      # Windows: Microsoft Trusted Signing (if configured)
      - name: Sign Windows Installers with Microsoft Trusted Signing
        if: matrix.os == 'windows-latest' && env.AZURE_CLIENT_ID != '' && env.WINDOWS_CERTIFICATE == ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      # Upload desktop artifacts
      - name: Upload macOS Desktop Artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows Desktop Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy production
    needs: [web, desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never interrupt an upload. Recheck main inside this lock because older
    # workflows can finish their tests after a newer release has deployed.
    concurrency:
      group: netlify-production
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - name: Skip superseded commits
        id: release
        shell: bash
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$latest"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping $GITHUB_SHA; main is now $latest." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.release.outputs.current == 'true'
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.current == 'true'
        with:
          name: production-build
          path: dist/
      - name: Publish tested build
        if: steps.release.outputs.current == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"
          npx --yes netlify-cli@26.0.1 deploy --prod --dir dist --no-build --site "$NETLIFY_SITE_ID" --message "$GITHUB_SHA"
      - name: Verify published files
        if: steps.release.outputs.current == 'true'
        run: node scripts/verify-deploy.mjs
