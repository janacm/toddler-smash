<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Toddler Smash</title>
    <!-- Home-screen install on iPhone/iPad: open without Safari's bars. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smash" />
    <meta name="theme-color" content="#1b2035" />
    <!-- Inline so there is no favicon request to 404. Keeps the screenshot
         harness's "any console error is a real failure" rule honest. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #10131c;
        /* A toddler's palm will drag across the screen. None of that should
           select text, show a callout, or trigger pull-to-refresh. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game canvas { display: block; }

      /* Loading splash. Colours (--splash-*) come from CONFIG.moods via
         src/splash.ts; timing lives in CONFIG.splash. It never takes input:
         presses fall through to the game underneath. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: min(8vh, 56px);
        background: linear-gradient(var(--splash-top), var(--splash-bottom));
        pointer-events: none;
        transition: opacity var(--splash-fade) ease-in, transform var(--splash-fade) ease-in;
      }
      #splash.splash-done {
        opacity: 0;
        transform: scale(1.08);
      }
      .splash-logo {
        position: relative;
        font-family: 'Arial Rounded MT Bold', ui-rounded, 'Nunito', Verdana, sans-serif;
        font-weight: 900;
        font-size: min(20vw, 19vh, 170px);
        line-height: 1;
        text-align: center;
        white-space: nowrap;
      }
      #splash.splash-boop .splash-logo {
        animation: splash-boop 0.4s ease-out;
      }
      .splash-toddler {
        font-size: 0.52em;
        margin-bottom: 0.04em;
      }
      .splash-logo span {
        display: inline-block;
        transform-origin: 50% 100%;
        --o: var(--splash-outline);
        text-shadow:
          0.06em 0 0 var(--o), -0.06em 0 0 var(--o), 0 0.06em 0 var(--o), 0 -0.06em 0 var(--o),
          0.042em 0.042em 0 var(--o), -0.042em 0.042em 0 var(--o),
          0.042em -0.042em 0 var(--o), -0.042em -0.042em 0 var(--o),
          0 0.12em 0.06em rgba(20, 30, 70, 0.18);
        animation: splash-hop 1.8s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.08s);
      }
      .splash-logo span:nth-child(odd) { --r: -5deg; }
      .splash-logo span:nth-child(even) { --r: 4deg; }
      @keyframes splash-hop {
        0%, 55%, 100% { transform: translateY(0) rotate(var(--r)) scale(1, 1); }
        12% { transform: translateY(0) rotate(var(--r)) scale(1.14, 0.84); }
        28% { transform: translateY(-0.24em) rotate(calc(var(--r) * -1)) scale(0.92, 1.1); }
        42% { transform: translateY(0) rotate(var(--r)) scale(1.08, 0.92); }
      }
      @keyframes splash-boop {
        30% { transform: scale(1.12, 0.88); }
        65% { transform: scale(0.95, 1.06); }
      }

      /* Toy shapes bobbing around the logo, like the ones in the game. */
      .splash-deco {
        position: absolute;
        width: 0.34em;
        aspect-ratio: 1;
        animation: splash-bob 2.6s ease-in-out infinite;
      }
      .splash-star { clip-path: polygon(50% 0, 62% 36%, 100% 36%, 69% 58%, 81% 95%, 50% 72%, 19% 95%, 31% 58%, 0 36%, 38% 36%); }
      .splash-circle { border-radius: 50%; width: 0.24em; }
      .splash-ring { border-radius: 50%; width: 0.26em; box-sizing: border-box; border: 0.06em solid var(--c); }
      .splash-triangle { clip-path: polygon(50% 8%, 96% 88%, 4% 88%); }
      @keyframes splash-bob {
        0%, 100% { transform: translateY(0) rotate(-12deg); }
        50% { transform: translateY(-0.12em) rotate(14deg); }
      }

      /* Spinner: a ring of palette dots, each gently swelling in turn. */
      .splash-spinner {
        position: relative;
        width: min(15vw, 9vh, 68px);
        aspect-ratio: 1;
        animation: splash-spin 2.4s linear infinite;
      }
      .splash-spinner i {
        position: absolute;
        left: 39%;
        top: 39%;
        width: 22%;
        aspect-ratio: 1;
        transform: rotate(calc(var(--i) * 45deg)) translateY(-170%);
      }
      .splash-spinner i::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--c);
        animation: splash-pulse 1.2s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.15s - 1.2s);
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(0.55); }
        50% { transform: scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-logo span, .splash-deco { animation: none; transform: rotate(var(--r, 0deg)); }
        .splash-spinner { animation-duration: 8s; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Toddler Smash is loading">
      <div class="splash-logo" aria-hidden="true">
        <div class="splash-toddler">
          <span style="--i: 0; color: var(--splash-0)">T</span><span style="--i: 1; color: var(--splash-1)">o</span><span style="--i: 2; color: var(--splash-2)">d</span><span style="--i: 3; color: var(--splash-4)">d</span><span style="--i: 4; color: var(--splash-3)">l</span><span style="--i: 5; color: var(--splash-5)">e</span><span style="--i: 6; color: var(--splash-6)">r</span>
        </div>
        <div class="splash-smash">
          <span style="--i: 7; color: var(--splash-7)">S</span><span style="--i: 8; color: var(--splash-0)">m</span><span style="--i: 9; color: var(--splash-1)">a</span><span style="--i: 10; color: var(--splash-4)">s</span><span style="--i: 11; color: var(--splash-5)">h</span>
        </div>
        <b class="splash-deco splash-star" style="left: -0.42em; top: -0.12em; background: var(--splash-2)"></b>
        <b class="splash-deco splash-circle" style="right: -0.34em; top: 0.05em; background: var(--splash-7); animation-delay: -0.9s"></b>
        <b class="splash-deco splash-ring" style="left: -0.36em; bottom: 0.08em; --c: var(--splash-3); animation-delay: -1.6s"></b>
        <b class="splash-deco splash-triangle" style="right: -0.44em; bottom: 0.12em; background: var(--splash-6); animation-delay: -0.4s"></b>
      </div>
      <div class="splash-spinner" aria-hidden="true">
        <i style="--i: 0; --c: var(--splash-0)"></i><i style="--i: 1; --c: var(--splash-1)"></i><i style="--i: 2; --c: var(--splash-2)"></i><i style="--i: 3; --c: var(--splash-3)"></i><i style="--i: 4; --c: var(--splash-4)"></i><i style="--i: 5; --c: var(--splash-5)"></i><i style="--i: 6; --c: var(--splash-6)"></i><i style="--i: 7; --c: var(--splash-7)"></i>
      </div>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
